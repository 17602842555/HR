services:
  cloudflared:
    image: cloudflare/cloudflared:2026.5.0
    restart: always
    depends_on:
      api:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    networks:
      - default
