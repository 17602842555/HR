name: Deploy HR OA frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL || secrets.CLOUDFLARE_DEPLOYMENT_URL || 'https://deep-oa-hr.2445776963.workers.dev' }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      ADMIN_BOOTSTRAP_READY: ${{ secrets.CLOUDFLARE_BOOTSTRAP_ADMIN_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install
        run: npm ci

      - name: Normalize Cloudflare Worker URL
        id: cloudflare
        shell: bash
        run: |
          deployment_url="${CLOUDFLARE_DEPLOYMENT_URL%/}"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Build frontend for GitHub Pages
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.cloudflare.outputs.deployment_url }}/api
          VITE_BASE_PATH: /HR/
          VITE_DEMO_FALLBACK: "0"
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_REQUIRE_API: "1"

      - name: Validate commercial frontend bundle
        run: npm run validate:frontend-bundle

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Playwright Chromium for public session smoke
        if: ${{ env.ADMIN_BOOTSTRAP_READY == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Smoke GitHub Pages to Worker browser session
        if: ${{ env.ADMIN_BOOTSTRAP_READY == 'true' }}
        run: >
          npm run smoke:no-domain-public -- --json
          --expected-sha "$GITHUB_SHA"
          --pages-url "${{ steps.deployment.outputs.page_url }}"
          --worker-url "${{ steps.cloudflare.outputs.deployment_url }}"
          --require-browser-login
        env:
          PUBLIC_SMOKE_LOGIN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_ADMIN_LOGIN || 'admin@oa.local' }}
          PUBLIC_SMOKE_PASSWORD: ${{ secrets.CLOUDFLARE_BOOTSTRAP_ADMIN_PASSWORD }}

      - name: Public session smoke credentials not configured
        if: ${{ env.ADMIN_BOOTSTRAP_READY != 'true' }}
        run: |
          echo "GitHub Pages deployed, but browser session smoke was skipped."
          echo "Configure CLOUDFLARE_BOOTSTRAP_ADMIN_PASSWORD and optionally CLOUDFLARE_BOOTSTRAP_ADMIN_LOGIN to make this deploy produce release-grade no-domain evidence."
