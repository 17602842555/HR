name: Deploy HR OA frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL || secrets.CLOUDFLARE_DEPLOYMENT_URL || 'https://deep-oa-hr.2445776963.workers.dev' }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install
        run: npm ci

      - name: Normalize Cloudflare Worker URL
        id: cloudflare
        shell: bash
        run: |
          deployment_url="${CLOUDFLARE_DEPLOYMENT_URL%/}"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Build frontend for GitHub Pages
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.cloudflare.outputs.deployment_url }}/api
          VITE_BASE_PATH: /HR/
          VITE_DEMO_FALLBACK: "0"
          VITE_REQUIRE_API: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
