name: Deploy HR OA to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_deploy:
        description: "Fail if Cloudflare deployment secrets or smoke URL are missing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      DEPLOYMENT_URL_READY: ${{ secrets.CLOUDFLARE_DEPLOYMENT_URL != '' || vars.CLOUDFLARE_DEPLOYMENT_URL != '' }}
      REQUIRE_CLOUDFLARE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.require_deploy }}
      CLOUDFLARE_DEPLOYMENT_URL: ${{ secrets.CLOUDFLARE_DEPLOYMENT_URL || vars.CLOUDFLARE_DEPLOYMENT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify frontend build
        run: npm run build
        env:
          VITE_REQUIRE_API: "1"
          VITE_DEMO_FALLBACK: "0"

      - name: Require Cloudflare deployment configuration
        if: ${{ env.REQUIRE_CLOUDFLARE_DEPLOY == 'true' && (env.CLOUDFLARE_READY != 'true' || env.DEPLOYMENT_URL_READY != 'true') }}
        run: |
          echo "::error::Cloudflare deployment was explicitly required, but one or more required repository secrets or variables are missing."
          echo "Required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_DEPLOYMENT_URL."
          echo "Use require_deploy=false only for a build-only workflow dry run."
          exit 1

      - name: Deploy Worker with assets and native API
        if: ${{ env.CLOUDFLARE_READY == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke deployed backend gateway
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.DEPLOYMENT_URL_READY == 'true' }}
        run: npm run smoke:cloudflare -- --url "$CLOUDFLARE_DEPLOYMENT_URL" --json

      - name: Cloudflare smoke URL not configured
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.DEPLOYMENT_URL_READY != 'true' }}
        run: echo "Worker deployed, but CLOUDFLARE_DEPLOYMENT_URL is missing so deployed native API smoke was skipped."

      - name: Cloudflare secrets not configured
        if: ${{ env.CLOUDFLARE_READY != 'true' }}
        run: |
          echo "Cloudflare deploy skipped."
          echo "Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_DEPLOYMENT_URL repository secrets or variables, then rerun this workflow."
