name: Deploy HR OA to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      API_ORIGIN_READY: ${{ secrets.API_ORIGIN != '' }}
      DEPLOYMENT_URL_READY: ${{ secrets.CLOUDFLARE_DEPLOYMENT_URL != '' || vars.CLOUDFLARE_DEPLOYMENT_URL != '' }}
      CLOUDFLARE_DEPLOYMENT_URL: ${{ secrets.CLOUDFLARE_DEPLOYMENT_URL || vars.CLOUDFLARE_DEPLOYMENT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify frontend build
        run: npm run build
        env:
          VITE_REQUIRE_API: "1"
          VITE_DEMO_FALLBACK: "0"

      - name: Deploy Worker with assets
        if: ${{ env.CLOUDFLARE_READY == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Configure API origin secret
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' }}
        run: printf '%s' "$API_ORIGIN" | npx wrangler secret put API_ORIGIN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}

      - name: Cloudflare API origin not configured
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY != 'true' }}
        run: echo "Worker deployed, but API_ORIGIN is not configured. /api/* will return 503 until the backend origin secret is set."

      - name: Smoke deployed backend gateway
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' && env.DEPLOYMENT_URL_READY == 'true' }}
        run: npm run smoke:cloudflare -- --url "$CLOUDFLARE_DEPLOYMENT_URL" --json

      - name: Cloudflare smoke URL not configured
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' && env.DEPLOYMENT_URL_READY != 'true' }}
        run: echo "Worker deployed and API_ORIGIN configured, but CLOUDFLARE_DEPLOYMENT_URL is missing so deployed backend smoke was skipped."

      - name: Cloudflare secrets not configured
        if: ${{ env.CLOUDFLARE_READY != 'true' }}
        run: |
          echo "Cloudflare deploy skipped."
          echo "Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, API_ORIGIN, and CLOUDFLARE_DEPLOYMENT_URL repository secrets or variables, then rerun this workflow."
