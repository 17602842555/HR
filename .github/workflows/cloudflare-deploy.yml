name: Deploy HR OA to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      API_ORIGIN_READY: ${{ secrets.API_ORIGIN != '' }}
      TUNNEL_TOKEN_READY: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN != '' }}
      DEPLOYMENT_URL_READY: ${{ secrets.CLOUDFLARE_DEPLOYMENT_URL != '' || vars.CLOUDFLARE_DEPLOYMENT_URL != '' }}
      CLOUDFLARE_DEPLOYMENT_URL: ${{ secrets.CLOUDFLARE_DEPLOYMENT_URL || vars.CLOUDFLARE_DEPLOYMENT_URL }}
      CLOUDFLARE_BACKEND_WEB_ORIGIN: ${{ secrets.CLOUDFLARE_BACKEND_WEB_ORIGIN || vars.CLOUDFLARE_BACKEND_WEB_ORIGIN || secrets.CLOUDFLARE_DEPLOYMENT_URL || vars.CLOUDFLARE_DEPLOYMENT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify frontend build
        run: npm run build
        env:
          VITE_REQUIRE_API: "1"
          VITE_DEMO_FALLBACK: "0"

      - name: Validate Cloudflare backend server config
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' && env.DEPLOYMENT_URL_READY == 'true' && env.TUNNEL_TOKEN_READY == 'true' }}
        run: |
          set -euo pipefail
          umask 077
          backend_env="$(mktemp)"
          trap 'rm -f "$backend_env"' EXIT
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN="%s"\n' "$CLOUDFLARE_TUNNEL_TOKEN"
            printf 'API_ORIGIN="%s"\n' "$API_ORIGIN"
            printf 'CLOUDFLARE_DEPLOYMENT_URL="%s"\n' "$CLOUDFLARE_DEPLOYMENT_URL"
            printf 'WEB_ORIGIN="%s"\n' "$CLOUDFLARE_BACKEND_WEB_ORIGIN"
            printf 'TRUST_PROXY="1"\n'
            printf 'RUN_DB_SEED="0"\n'
          } > "$backend_env"
          npm run validate:cloudflare-backend -- --env "$backend_env" --json
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

      - name: Cloudflare backend server config not configured
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' && env.DEPLOYMENT_URL_READY == 'true' && env.TUNNEL_TOKEN_READY != 'true' }}
        run: echo "Worker deploy can continue, but CLOUDFLARE_TUNNEL_TOKEN is missing so backend tunnel env validation was skipped."

      - name: Deploy Worker with assets
        if: ${{ env.CLOUDFLARE_READY == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Configure API origin secret
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' }}
        run: printf '%s' "$API_ORIGIN" | npx wrangler secret put API_ORIGIN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}

      - name: Cloudflare API origin not configured
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY != 'true' }}
        run: echo "Worker deployed, but API_ORIGIN is not configured. /api/* will return 503 until the backend origin secret is set."

      - name: Smoke deployed backend gateway
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' && env.DEPLOYMENT_URL_READY == 'true' }}
        run: npm run smoke:cloudflare -- --url "$CLOUDFLARE_DEPLOYMENT_URL" --json

      - name: Cloudflare smoke URL not configured
        if: ${{ env.CLOUDFLARE_READY == 'true' && env.API_ORIGIN_READY == 'true' && env.DEPLOYMENT_URL_READY != 'true' }}
        run: echo "Worker deployed and API_ORIGIN configured, but CLOUDFLARE_DEPLOYMENT_URL is missing so deployed backend smoke was skipped."

      - name: Cloudflare secrets not configured
        if: ${{ env.CLOUDFLARE_READY != 'true' }}
        run: |
          echo "Cloudflare deploy skipped."
          echo "Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, API_ORIGIN, CLOUDFLARE_DEPLOYMENT_URL, and CLOUDFLARE_TUNNEL_TOKEN repository secrets or variables, then rerun this workflow."
