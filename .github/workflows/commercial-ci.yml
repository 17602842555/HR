name: commercial-ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-commercial-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oa_commercial
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: oa_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oa -d oa_commercial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: ci
      NODE_ENV: test
      DATABASE_URL: postgresql://oa:oa_ci_password@127.0.0.1:5432/oa_commercial?schema=public
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 8787
      API_BASE_URL: http://127.0.0.1:8787
      DEFAULT_TENANT_CODE: default
      DEFAULT_ADMIN_EMAIL: admin@oa.local
      DEFAULT_ADMIN_PASSWORD: ci-admin-password-20260530
      JWT_SECRET: ci-commercial-secret-change-before-release-20260530
      COOKIE_MAX_AGE_SECONDS: 28800
      AUTH_FAILED_LOGIN_LIMIT: 5
      AUTH_FAILED_LOGIN_WINDOW_MS: 600000
      AUTH_FAILED_LOGIN_MAX_KEYS: 10000
      FILE_STORAGE_DIR: .ci-files
      FILE_MAX_UPLOAD_BYTES: 5242880
      IMPORT_MAX_HTML_BYTES: 10485760
      API_BODY_LIMIT_BYTES: 10551296
      RUN_DB_SEED: 1
      WEB_ORIGIN: http://127.0.0.1:5174,http://localhost:5174
      TRUST_PROXY: "0"
      VITE_REQUIRE_API: "1"
      VITE_DEMO_FALLBACK: "0"
      VITE_API_PROXY_TARGET: http://127.0.0.1:8787
      RUN_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run commercial CI gate
        run: npm run ci:commercial

      - name: Upload commercial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commercial-ci-artifacts
          path: |
            commercial-evidence
            playwright-report
            test-results
          if-no-files-found: ignore
